    note: Breeder dashboard tools (Pair Predictor, eCOI). Web features, not an API.
  - url: https://help.embarkvet.com/hc/en-us/sections/10867850136731-Partner-With-Us
    type: Documentation
    note: Partner program - partnership-gated, not a self-serve API.
  - url: https://en.wikipedia.org/wiki/Embark_Veterinary
    type: Reference
    note: Company background (founded 2015, Boston; Cornell research partnership). No API mentioned.
  - url: https://github.com/ProjectAussie
