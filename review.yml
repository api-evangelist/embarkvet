    note: Research/publication code from Embark scientists. Not a company product API.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Embark publishes no public developer
    API of any kind. Embark is a direct-to-consumer canine genetics service; data
    reaches users through its own web/app dashboards and a per-account raw data
    download, with research access gated behind direct partnership. No AsyncAPI or
    OpenAPI document was created because there is no documented API surface on
    Embark's own platform to model, and no apis were listed in apis.yml for the
    same reason. This entry is an honest stub.
